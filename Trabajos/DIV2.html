<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif" href="IMG/pacman.gif">
    <title>Relative DIV</title>
    <style>
        div.relativo{
            position: relative;
            left: 30px;
            border: 5px solid red;
        }
    </style>
</head>
<body>
    <h2>Posicion del DIV: relative;</h2>
    <p>Un elemento con posicion relativa se puede ubicar de manera relativa a su posicion original, y se puede modificar su ubicacion desde CSS</p>

    <div class="relativo">
        <p>Este elemento DIV tiene asignada la posicion: <b><i>relative;</i></b></p>
    </div>
</body>
</html>
