<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Span</title>
    <link rel="icon" type="image/gif" href="IMG/pacman.gif">
    <style type="text/css">
        .tipos_fruta{
            color: blueviolet;
            font-size: 150%;
            text-decoration: underline;
        }

        .ejemplo_fruta{
            color: blue;
            font-size: 120%;
        }
    </style>
</head>
<body>
    <h2>Usando SPAN para dar formato a texto con CSS</h2>
    <p>
        <span class="tipos_fruta">Frutas con hueso:</span>
        <span class="ejemplo_fruta">Durazno</span>
        <span class="ejemplo_fruta">Ciruela</span>
        <span class="ejemplo_fruta">Aguacate</span>
        <span class="ejemplo_fruta">Mango</span>
        <span class="ejemplo_fruta">Rambutan</span>
    </p>
    <p>
        <span class="tipos_fruta">Frutas con semilla:</span>
        <span class="ejemplo_fruta">Manzana</span>
        <span class="ejemplo_fruta">Pera</span>
        <span class="ejemplo_fruta">Naranja</span>
        <span class="ejemplo_fruta">Mandarina</span>
    </p>
</body>
</html>
