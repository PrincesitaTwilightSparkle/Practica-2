<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif" href="../IMG/pacman.gif">
    <title>Static DIV</title>
    <style>
        div.estatico{
            position:static;
            border: 3px solid green;
        }
    </style>
</head>
<body>
    <h2>Posicion del DIV: static;</h2>
    <p>Un elemento con posicion estatica no se ubica de ninguna forma especial, se ubica siempre segun el flujo normal de la pagina</p>

    <div class="estatico">
        <p>Este elemento DIV tiene asignada la posicion: <b><i>static;</i></b></p>
    </div>
</body>
</html>
